<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 자바스크랍트 태그 생성</title>
</head>
<body>
    <div id="log-conrainer"></div>

    <script>
        const container = document.querySelector('#log-container');
        
        for (let i=6; i>=1; i--) {
            // 템풀릿 리터럴로 HTML 코드 가독성 확보
            const tagTemplate = `<h${i}> 자바스크립트에서 태그 쓰기</h${i}>`;
            // 기존 화면을 지우지 않고 컨테이너 안에 차곡차곡 쌓는 방법
            container.insertAdjacentHTML('beforeend', tagTemplate);
        }
    </script>
</body>
</html>
