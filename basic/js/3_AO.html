<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산술 연산자</title>
    <script>
        let A = 10;
        let B = 3;
        let result;
        document.write(result + '<br>');
        // 값을 할당하지 않은 변수는
        // undefined(정의되지 않음) 이라고 출력된다.

        result = A + B;
        document.write(result + '<br>');
        document.write(`${result} <br>`);
        result = A - B;
        document.write(result + '<br>');
        result = A * B;
        document.write(result + '<br>');
        result = A / B;
        document.write(result + '<br>');
        result = A % B;
        document.write(result + '<br>');
        

        // document.write(result + '<br>');
        // 협업에서는 위와 같은 방식을 사용하지 않는다.
        // 템플릿 리터널을 활용해서 위의 방식을 대체한다.
        // document.write(`${result} <br>`);
        // ' : 백틱기호 / ${} 변수사용 '

        let num = A/B;
        document.write(num.toFixed(3));
        // 현업에서 돈을 계산하거나 정밀한 수치를 다룰 떄 이런 소숫점이
        // 그대로 노출된 것을 방지하고자 toFixed()나 Math.floor() 와
        // 같은 내장함수를 사용하여 방어 코드를 작성한다.
    </script>
</head>
<body>
    
</body>
</html>
